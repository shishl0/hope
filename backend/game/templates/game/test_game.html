<!DOCTYPE html>
<html>

<head>
    <title>2D Tank Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
        }

        canvas {
            border: 1px solid black;
            background: #eee;
        }

        #controls {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id="controls">
        <h3>2D WebSockets Mini-Game</h3>
        <p>Wait for another browser tab to join to see multiplayer.</p>
        <button id="connectBtn">Connect to server</button>
        Lobby info: <span id="lobbyStatus">Not connected</span> | Ping: <span id="pingCounter">0</span>ms
        <div style="margin-top: 10px; background: #ddd; padding: 10px;">
            <strong>Key Bindings (click to change):</strong>
            Up: <button id="bindUp">KeyW</button>
            Down: <button id="bindDown">KeyS</button>
            Left: <button id="bindLeft">KeyA</button>
            Right: <button id="bindRight">KeyD</button>
            Machine Gun: <button id="bindMG">KeyG</button>
        </div>
    </div>
    <div style="position: relative; width: 800px; height: 600px;">
        <canvas id="gameCanvas" width="800" height="600"
            style="position: absolute; top:0; left:0; border: 1px solid black; background: #eee; cursor: crosshair;"></canvas>
        <div id="respawnUI"
            style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; color: red; display: none; text-shadow: 1px 1px 2px black;">
            Respawning in <span id="respawnTimer">3.0</span>s
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const respawnUI = document.getElementById('respawnUI');
        const respawnTimerText = document.getElementById('respawnTimer');
        const pingCounter = document.getElementById('pingCounter');
        
        let socket = null;
        let myId = Math.floor(Math.random() * 10000).toString();
        let players = {};
        let bullets = [];
        let mapSize = { w: 2000, h: 2000 };

        let isMouseDown = false;
        let mouseScreenPos = { x: 0, y: 0 };
        let mouseWorldPos = { x: 0, y: 0 };
        let lastSentMouse = { x: -1, y: -1, firing: false };
        const keys = { up: false, down: false, left: false, right: false };
        let bindings = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', mg: 'KeyG' };
        
        function bindKey(id, action) {
            const btn = document.getElementById(id);
            btn.onclick = () => {
                btn.innerText = "Press any key...";
                const handler = (e) => {
                    e.preventDefault();
                    bindings[action] = e.code;
                    btn.innerText = e.code;
                    window.removeEventListener('keydown', handler);
                };
                window.addEventListener('keydown', handler);
            };
        }
        bindKey('bindUp', 'up'); bindKey('bindDown', 'down');
        bindKey('bindLeft', 'left'); bindKey('bindRight', 'right'); bindKey('bindMG', 'mg');

        document.getElementById('connectBtn').addEventListener('click', () => {
            if (socket) return;
            const lobbyId = "testlobby1";
            socket = new WebSocket(`ws://${window.location.host}/ws/game/${lobbyId}/`);
            
            socket.onopen = function(e) {
                document.getElementById('lobbyStatus').innerText = "Connected as " + myId;
                socket.send(JSON.stringify({ type: 'join', id: myId }));

                // Start ping loop
                setInterval(() => {
                    if (socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ type: 'ping', time: Date.now() }));
                    }
                }, 1000);
            };

            socket.onmessage = function(event) {
                const data = JSON.parse(event.data);

                if (data.type === 'pong' && data.id === myId) {
                    pingCounter.innerText = Date.now() - data.client_time;
                } else if (data.type === 'tick') {
                    // Sync map occasionally
                    if (data.map) mapSize = data.map;
                    
                    bullets = data.bullets; 
                    
                    // Sync players
                    for (let pid in data.players) {
                        const serverP = data.players[pid];
                        if (!players[pid]) {
                            // Init local ghost
                            players[pid] = { 
                                ...serverP, 
                                renderX: serverP.x, renderY: serverP.y,
                                renderHullAngle: serverP.hull_angle, renderTurretAngle: serverP.turret_angle
                            };
                        } else {
                            // Update target positions for LERP
                            players[pid].x = serverP.x;
                            players[pid].y = serverP.y;
                            players[pid].hull_angle = serverP.hull_angle;
                            players[pid].turret_angle = serverP.turret_angle;
                            players[pid].hp = serverP.hp;
                            players[pid].isDead = serverP.isDead;
                            players[pid].isSafe = serverP.isSafe;
                            players[pid].color = serverP.color;
                            players[pid].maxHp = serverP.maxHp;
                            if (serverP.respawnTimer !== undefined) {
                                players[pid].respawnTimer = serverP.respawnTimer;
                            }
                        }
                    }

                    // Remove disconnected players
                    for (let pid in players) {
                        if (!data.players[pid]) {
                            delete players[pid];
                        }
                    }
                }
            };

            socket.onclose = () => {
                document.getElementById('lobbyStatus').innerText = "Disconnected";
                socket = null;
            };
        });

        function sendInput(action, state) {
            if (keys[action] !== state) {
                keys[action] = state;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'input', action: action, state: state }));
                }
            }
        }

        window.addEventListener('keydown', e => {
            if (e.code === bindings.up) sendInput('up', true);
            if (e.code === bindings.down) sendInput('down', true);
            if (e.code === bindings.left) sendInput('left', true);
            if (e.code === bindings.right) sendInput('right', true);
            if (e.code === bindings.mg) { isMouseDown = true; sendMouse(); }
        });
        window.addEventListener('keyup', e => {
            if (e.code === bindings.up) sendInput('up', false);
            if (e.code === bindings.down) sendInput('down', false);
            if (e.code === bindings.left) sendInput('left', false);
            if (e.code === bindings.right) sendInput('right', false);
            if (e.code === bindings.mg) { isMouseDown = false; sendMouse(); }
        });

        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; sendMouse(); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; sendMouse(); });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseScreenPos.x = e.clientX - rect.left;
            mouseScreenPos.y = e.clientY - rect.top;
        });

        function sendMouse() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                // Only send if it moved meaningfully or firing state changed
                const diffX = Math.abs(mouseWorldPos.x - lastSentMouse.x);
                const diffY = Math.abs(mouseWorldPos.y - lastSentMouse.y);
                if (diffX > 1 || diffY > 1 || isMouseDown !== lastSentMouse.firing) {
                     socket.send(JSON.stringify({
                         type: 'mouse', 
                         mouseX: mouseWorldPos.x, 
                         mouseY: mouseWorldPos.y, 
                         isFiring: isMouseDown 
                     }));
                     lastSentMouse.x = mouseWorldPos.x;
                     lastSentMouse.y = mouseWorldPos.y;
                     lastSentMouse.firing = isMouseDown;
                }
            }
        }

        function getCamera() {
            let cx = 0, cy = 0;
            if (players[myId]) {
                cx = players[myId].renderX - canvas.width / 2;
                cy = players[myId].renderY - canvas.height / 2;
                // Clamp camera to map bounds
                cx = Math.max(0, Math.min(mapSize.w - canvas.width, cx));
                cy = Math.max(0, Math.min(mapSize.h - canvas.height, cy));
            }
            return { x: cx, y: cy };
        }

        function drawMaxHpBar(x, y, currentHp, maxHp) {
            // Fallback sizes in case server tick is delayed
            let hp = currentHp !== undefined ? currentHp : 500;
            let mHp = maxHp !== undefined ? maxHp : 500;
            
            const width = 50;
            const height = 8;
            const barX = x - width / 2;
            const barY = y - 35; // Above player

            ctx.fillStyle = 'red';
            ctx.fillRect(barX, barY, width, height);

            ctx.fillStyle = '#00ff00';
            ctx.fillRect(barX, barY, width * (hp / mHp), height);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.strokeRect(barX, barY, width, height);
        }

        function lerpAngle(a, b, t) {
            let diff = b - a;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            return a + diff * t;
        }

        function update() {
            // Lerp interpolation to smooth out the 30Hz server ticks
            const LERP_FACTOR = 0.3;
            for (let id in players) {
                let p = players[id];
                if (p.isDead) continue;
                p.renderX += (p.x - p.renderX) * LERP_FACTOR;
                p.renderY += (p.y - p.renderY) * LERP_FACTOR;
                
                if (p.renderHullAngle === undefined) p.renderHullAngle = p.hull_angle;
                if (p.renderTurretAngle === undefined) p.renderTurretAngle = p.turret_angle;
                
                p.renderHullAngle = lerpAngle(p.renderHullAngle, p.hull_angle, LERP_FACTOR);
                p.renderTurretAngle = lerpAngle(p.renderTurretAngle, p.turret_angle, LERP_FACTOR);
            }

            // Always update mouse aiming coordinates during movement
            const cam = getCamera();
            mouseWorldPos.x = mouseScreenPos.x + cam.x;
            mouseWorldPos.y = mouseScreenPos.y + cam.y;
            sendMouse();

            // Local UI Respawn checking
            if (players[myId]) {
                if (players[myId].isDead) {
                    respawnUI.style.display = 'block';
                    const timer = players[myId].respawnTimer || 0;
                    respawnTimerText.innerText = Math.max(0, timer).toFixed(1);
                } else {
                    respawnUI.style.display = 'none';
                }
            }
        }

        function drawGrid(cam) {
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            const gridSize = 100;

            const startX = Math.floor(cam.x / gridSize) * gridSize;
            const startY = Math.floor(cam.y / gridSize) * gridSize;

            ctx.beginPath();
            for (let x = startX; x < cam.x + canvas.width; x += gridSize) {
                ctx.moveTo(x, cam.y);
                ctx.lineTo(x, cam.y + canvas.height);
            }
            for (let y = startY; y < cam.y + canvas.height; y += gridSize) {
                ctx.moveTo(cam.x, y);
                ctx.lineTo(cam.x + canvas.width, y);
            }
            ctx.stroke();

            // Draw map bounds
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, mapSize.w, mapSize.h);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cam = getCamera();
            ctx.save();
            ctx.translate(-cam.x, -cam.y);

            drawGrid(cam);
            
            // Draw players
            for (let id in players) {
                const p = players[id];
                if (p.isDead) continue;
                
                ctx.globalAlpha = p.isSafe ? 0.3 : 1.0;
                
                // Draw Hull
                ctx.save();
                ctx.translate(p.renderX, p.renderY);
                ctx.rotate(p.renderHullAngle || 0);
                
                // Tracks
                ctx.fillStyle = '#333';
                ctx.fillRect(-18, -18, 36, 8); // left track
                ctx.fillRect(-18, 10, 36, 8);  // right track
                
                // Hull body
                ctx.fillStyle = p.color || 'red';
                ctx.fillRect(-15, -12, 30, 24);
                
                // Direction indicator (front of hull indicator)
                ctx.fillStyle = 'white';
                ctx.fillRect(10, -3, 4, 6);
                ctx.restore();

                // Draw Turret
                ctx.save();
                ctx.translate(p.renderX, p.renderY);
                ctx.rotate(p.renderTurretAngle || 0);
                
                // Barrel
                ctx.fillStyle = '#555';
                ctx.fillRect(0, -3, 28, 6);
                
                // Turret body (circle)
                ctx.fillStyle = p.color || 'red';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Aiming Laser from barrel tip
                if (id === myId) {
                    ctx.beginPath();
                    ctx.setLineDash([10, 10]);
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.moveTo(28, 0); // start at barrel tip
                    ctx.lineTo(800, 0); // extend far out
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                ctx.restore();
                
                if (p.isSafe) {
                    ctx.fillStyle = 'black';
                    ctx.font = '12px Arial';
                    ctx.fillText('SAFE', p.renderX - 15, p.renderY - 20);
                } else {
                    drawMaxHpBar(p.renderX, p.renderY, p.hp, p.maxHp);
                }
                ctx.globalAlpha = 1.0;

                // Draw raw crosshair target for local player
                if (id === myId) {
                    ctx.globalAlpha = 0.5;
                    ctx.strokeStyle = 'black';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(mouseWorldPos.x, mouseWorldPos.y, 5, 0, Math.PI * 2);
                    ctx.moveTo(mouseWorldPos.x - 8, mouseWorldPos.y);
                    ctx.lineTo(mouseWorldPos.x + 8, mouseWorldPos.y);
                    ctx.moveTo(mouseWorldPos.x, mouseWorldPos.y - 8);
                    ctx.lineTo(mouseWorldPos.x, mouseWorldPos.y + 8);
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            }
            
            // Draw bullets
            ctx.fillStyle = 'black';
            for (let b of bullets) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2); // BULLET_SIZE / 2
                ctx.fill();
            }

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
